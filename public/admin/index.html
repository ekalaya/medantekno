<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - Medantekno</title>
  <link href="./config.yml?v=pkce_check" type="text/yaml" rel="cms-config-url" />
</head>

<!-- Use latest stable Decap CMS -->
<script src="https://unpkg.com/decap-cms@^3.3.0/dist/decap-cms.js"></script>
<script>
  CMS.init({
    config: {
      backend: {
        name: 'github',
        repo: 'ekalaya/medantekno',
        branch: 'main',
        auth_type: 'pkce',
        app_id: 'Ov23li0OHekkQVfEJJXL',
      },
      media_folder: 'public/images/uploads',
      public_folder: '/images/uploads',
      collections: [
        {
          name: "blog",
          label: "Blog",
          folder: "content/blog",
          create: true,
          slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
          fields: [
            { label: "Layout", name: "layout", widget: "hidden", default: "blog" },
            { label: "Title", name: "title", widget: "string" },
            { label: "Description", name: "description", widget: "text" },
            { label: "Publish Date", name: "date", widget: "datetime" },
            { label: "Featured Image", name: "thumbnail", widget: "image", required: false },
            { label: "Body", name: "body", widget: "markdown" }
          ]
        }
      ]
    }
  });
</script>
</body>

</html>
