<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Authentication Callback</title>
</head>

<body>
    <script>
        if (window.opener) {
            window.opener.postMessage(
                'authorization:github:success',
                window.location.origin
            );
            window.close();
        }
    </script>
</body>

</html>
